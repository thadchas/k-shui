[project]
name = "k-shui"
version = "0.1.0"
description = "k-shui — Kafka Streaming Hub UI. Open-source control center for Apache Kafka, Connect, Schema Registry, ksqlDB, Flink, metrics, lineage and alerts."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "k-shui contributors" }]
keywords = ["kafka", "control-center", "kafka-ui", "flink", "kafka-connect", "schema-registry", "lineage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "typer>=0.12",
  "httpx>=0.27",
  "confluent-kafka>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "apscheduler>=3.10,<4",
  "prometheus-client>=0.20",
  "structlog>=24.1",
  "python-jose[cryptography]>=3.3",
  "argon2-cffi>=23.1",
  "authlib>=1.3",
  "itsdangerous>=2.2",
  "sse-starlette>=2.1",
  "fastavro>=1.9",
  "protobuf>=5.27",
  "jsonschema>=4.23",
  "orjson>=3.10",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "aiosmtplib>=3.0",
  "cachetools>=5.4",
  "jsonpath-ng>=1.6",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
otel = ["opentelemetry-sdk>=1.26", "opentelemetry-instrumentation-fastapi>=0.47b0", "opentelemetry-exporter-otlp>=1.26"]

[project.scripts]
k-shui = "k_shui.cli:app"

[project.urls]
Homepage = "https://github.com/k-shui/k-shui"
Documentation = "https://github.com/k-shui/k-shui/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["k_shui"]
artifacts = ["k_shui/static/**"]

[tool.hatch.build.targets.sdist]
include = ["k_shui/**", "README.md"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "respx>=0.21",
  "types-PyYAML",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["alert_engine: run the test with the background alert engine started"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
