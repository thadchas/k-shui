name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: backend
        run: uv run ruff format --check .

      - name: pytest
        working-directory: backend
        run: uv run pytest --cov=k_shui --cov-report=term-missing

  release-tooling:
    name: release tooling (versions in lock-step)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # One release ships a wheel, an npm launcher, an image and a chart, each
      # carrying its own copy of the version. release-please bumps them together;
      # this fails the build if they ever drift apart.
      - name: All artifacts declare the same version
        run: python3 scripts/check_versions.py

      # Same idea for licensing: the root LICENSE must stay the full Apache-2.0
      # text (GitHub's detector is text-similarity based), every artifact must
      # carry a byte-identical copy of it plus the NOTICE, and every SPDX
      # declaration must still say Apache-2.0.
      - name: All artifacts ship the same Apache-2.0 licence
        run: python3 scripts/check_licenses.py

      - name: Unit-test the release tooling
        run: python3 -m unittest discover -s scripts/tests -t scripts/tests -v

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # scripts/ has its own ruff.toml; the backend keeps its [tool.ruff] block.
      - name: ruff check & format --check (scripts)
        run: |
          uvx ruff check scripts/
          uvx ruff format --check scripts/

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  package:
    name: python package (wheel ships the SPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # `npm run build` emits straight into backend/k_shui/static (vite.config.ts
      # outDir), which is what hatch picks up via tool.hatch.build.targets.wheel.artifacts.
      - name: Build frontend into backend/k_shui/static
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: uv build
        working-directory: backend
        run: uv build

      - name: Assert the wheel ships the built SPA
        working-directory: backend
        run: |
          set -euo pipefail
          whl=$(ls dist/*.whl)
          unzip -l "${whl}" | grep -q 'k_shui/static/index.html'
          assets=$(unzip -l "${whl}" | grep -c 'k_shui/static/assets/')
          echo "static assets in wheel: ${assets}"
          test "${assets}" -gt 0

      # Apache-2.0 §4 wants the licence and the NOTICE to travel with every copy.
      # PEP 639 (`license-files` in backend/pyproject.toml) puts them in
      # .dist-info/licenses/; accept the pre-639 .dist-info/ location too so a
      # hatchling downgrade reports a real problem rather than a path change.
      - name: Assert the wheel and the sdist ship LICENSE and NOTICE
        working-directory: backend
        run: |
          set -euo pipefail
          whl=$(ls dist/*.whl)
          sdist=$(ls dist/*.tar.gz)
          # listed into files rather than piped: `grep -q` stops reading at the
          # first hit, which would SIGPIPE the producer and trip pipefail.
          unzip -l "${whl}" > "${RUNNER_TEMP}/wheel.txt"
          tar tzf "${sdist}" > "${RUNNER_TEMP}/sdist.txt"
          for f in LICENSE NOTICE; do
            grep -qE "\.dist-info/(licenses/)?${f}$" "${RUNNER_TEMP}/wheel.txt"
            grep -qE "^[^/]+/${f}$" "${RUNNER_TEMP}/sdist.txt"
            echo "${f}: present in wheel and sdist"
          done
          unzip -p "${whl}" '*.dist-info/METADATA' > "${RUNNER_TEMP}/METADATA"
          grep -q '^License-Expression: Apache-2.0$' "${RUNNER_TEMP}/METADATA"

      - name: Smoke-test the wheel via uvx
        working-directory: backend
        run: |
          set -euo pipefail
          whl=$(ls "${PWD}"/dist/*.whl)
          uvx --from "${whl}" k-shui version
          uvx --from "${whl}" k-shui serve --port 8097 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8097/healthz && break || sleep 2
          done
          curl -fsS http://127.0.0.1:8097/api/v1/info
          curl -fsS http://127.0.0.1:8097/ | grep -q '<div id="root">'

  npm-package:
    name: npm package (packages/npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm test
        working-directory: packages/npm
        run: npm test

      # npm auto-includes LICENSE from the package directory but not NOTICE, so
      # NOTICE has to be listed in `files` — assert on what npm would really pack.
      - name: Assert the published tarball ships LICENSE and NOTICE
        working-directory: packages/npm
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "${RUNNER_TEMP}/pack.json"
          for f in LICENSE NOTICE bin/k-shui.js; do
            jq -e --arg f "${f}" '.[0].files | map(.path) | index($f)' "${RUNNER_TEMP}/pack.json" > /dev/null
            echo "${f}: present in the npm tarball"
          done

  helm:
    name: helm lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: "latest"
      - name: helm lint
        run: helm lint charts/k-shui
      - name: helm template (default values)
        run: helm template t charts/k-shui
      - name: helm template (values-lakestream)
        run: helm template t charts/k-shui -f charts/k-shui/values-lakestream.yaml
      - name: helm template (every optional feature enabled)
        run: |
          helm template t charts/k-shui \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set networkPolicy.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.podMonitor.enabled=true \
            --set persistence.enabled=true \
            --set existingSecret=k-shui-credentials
      - name: Assert the packaged chart ships LICENSE
        run: |
          set -euo pipefail
          helm package charts/k-shui --destination "${RUNNER_TEMP}"
          tgz=$(ls "${RUNNER_TEMP}"/k-shui-*.tgz)
          tar tzf "${tgz}" > "${RUNNER_TEMP}/chart.txt"
          grep -qx 'k-shui/LICENSE' "${RUNNER_TEMP}/chart.txt"
          echo "LICENSE: present in $(basename "${tgz}")"

  kustomize:
    name: kustomize render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kubectl kustomize base
        run: kubectl kustomize deploy/kustomize/base
      - name: kubectl kustomize dev
        run: kubectl kustomize deploy/kustomize/overlays/dev
      - name: kubectl kustomize prod
        run: kubectl kustomize deploy/kustomize/overlays/prod

  docker:
    name: docker build (no push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          # load into the local daemon so the licence assertion below can read
          # the runtime stage back out of the built image
          load: true
          tags: k-shui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=0.0.0-ci
            VCS_REF=${{ github.sha }}

      # The image is a redistribution of k-shui and of the fonts/icons compiled
      # into the SPA, so it has to carry the licence, the NOTICE and the
      # third-party notices (see the runtime stage's COPY, and .dockerignore's
      # `!THIRD-PARTY-NOTICES.md` re-include).
      - name: Assert the image ships LICENSE, NOTICE and THIRD-PARTY-NOTICES.md
        run: |
          set -euo pipefail
          docker run --rm --entrypoint cat k-shui:ci \
            /app/NOTICE /app/THIRD-PARTY-NOTICES.md > /dev/null
          docker run --rm --entrypoint cat k-shui:ci /app/LICENSE > "${RUNNER_TEMP}/image-LICENSE"
          grep -q 'Apache License' "${RUNNER_TEMP}/image-LICENSE"
          diff -q LICENSE "${RUNNER_TEMP}/image-LICENSE"
          label=$(docker image inspect k-shui:ci \
            --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')
          test "${label}" = "Apache-2.0"
