name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: backend
        run: uv run ruff format --check .

      - name: pytest
        working-directory: backend
        run: uv run pytest --cov=k_shui --cov-report=term-missing

  release-tooling:
    name: release tooling (versions in lock-step)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # One release ships a wheel, an npm launcher, an image and a chart, each
      # carrying its own copy of the version. release-please bumps them together;
      # this fails the build if they ever drift apart.
      - name: All artifacts declare the same version
        run: python3 scripts/check_versions.py

      - name: Unit-test the release tooling
        run: python3 -m unittest discover -s scripts/tests -t scripts/tests -v

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # scripts/ has its own ruff.toml; the backend keeps its [tool.ruff] block.
      - name: ruff check & format --check (scripts)
        run: |
          uvx ruff check scripts/
          uvx ruff format --check scripts/

      # The reference generator imports the application, so unlike the rest of
      # scripts/ it needs the backend environment. One sync serves both steps
      # below; `--no-sync` keeps them from re-resolving it.
      - name: Sync the backend environment
        run: uv sync --project backend --frozen

      - name: Unit-test the reference generator
        run: uv run --project backend --frozen --no-sync python -m pytest scripts/tests/test_release_reference.py -q

      # A reference bundle that is not byte-reproducible cannot be verified by
      # the docs repository, so prove it on every pull request rather than
      # discovering it during a release. `--check` regenerates into a temporary
      # directory and diffs; the tag is a stand-in, the commit is this build's.
      - name: The reference bundle is deterministic
        run: |
          uv run --project backend --frozen --no-sync python scripts/generate_release_reference.py \
            --tag v0.0.0-ci --commit "${{ github.sha }}" --output-dir "${RUNNER_TEMP}/reference" --check

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  package:
    name: python package (wheel ships the SPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # `npm run build` emits straight into backend/k_shui/static (vite.config.ts
      # outDir), which is what hatch picks up via tool.hatch.build.targets.wheel.artifacts.
      - name: Build frontend into backend/k_shui/static
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: uv build
        working-directory: backend
        run: uv build

      - name: Assert the wheel ships the built SPA
        working-directory: backend
        run: |
          set -euo pipefail
          whl=$(ls dist/*.whl)
          unzip -l "${whl}" | grep -q 'k_shui/static/index.html'
          assets=$(unzip -l "${whl}" | grep -c 'k_shui/static/assets/')
          echo "static assets in wheel: ${assets}"
          test "${assets}" -gt 0

      - name: Smoke-test the wheel via uvx
        working-directory: backend
        run: |
          set -euo pipefail
          whl=$(ls "${PWD}"/dist/*.whl)
          uvx --from "${whl}" k-shui version
          uvx --from "${whl}" k-shui serve --port 8097 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8097/healthz && break || sleep 2
          done
          curl -fsS http://127.0.0.1:8097/api/v1/info
          curl -fsS http://127.0.0.1:8097/ | grep -q '<div id="root">'

  npm-package:
    name: npm package (packages/npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm test
        working-directory: packages/npm
        run: npm test

  helm:
    name: helm lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: "latest"
      - name: helm lint
        run: helm lint charts/k-shui
      - name: helm template (default values)
        run: helm template t charts/k-shui
      - name: helm template (values-lakestream)
        run: helm template t charts/k-shui -f charts/k-shui/values-lakestream.yaml
      - name: helm template (every optional feature enabled)
        run: |
          helm template t charts/k-shui \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set networkPolicy.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.podMonitor.enabled=true \
            --set persistence.enabled=true \
            --set existingSecret=k-shui-credentials

  kustomize:
    name: kustomize render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kubectl kustomize base
        run: kubectl kustomize deploy/kustomize/base
      - name: kubectl kustomize dev
        run: kubectl kustomize deploy/kustomize/overlays/dev
      - name: kubectl kustomize prod
        run: kubectl kustomize deploy/kustomize/overlays/prod

  docker:
    name: docker build (no push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: k-shui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=0.0.0-ci
            VCS_REF=${{ github.sha }}
