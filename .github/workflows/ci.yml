name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: backend
        run: uv run ruff format --check .

      - name: pytest
        working-directory: backend
        run: uv run pytest --cov=k_shui --cov-report=term-missing

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  npm-package:
    name: npm package (packages/npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm test
        working-directory: packages/npm
        run: npm test

  helm:
    name: helm lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "latest"
      - name: helm lint
        run: helm lint charts/k-shui
      - name: helm template (default values)
        run: helm template t charts/k-shui
      - name: helm template (values-lakestream)
        run: helm template t charts/k-shui -f charts/k-shui/values-lakestream.yaml

  kustomize:
    name: kustomize render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubectl kustomize base
        run: kubectl kustomize deploy/kustomize/base
      - name: kubectl kustomize dev
        run: kubectl kustomize deploy/kustomize/overlays/dev
      - name: kubectl kustomize prod
        run: kubectl kustomize deploy/kustomize/overlays/prod

  docker:
    name: docker build (no push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: k-shui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=0.0.0-ci
            VCS_REF=${{ github.sha }}
