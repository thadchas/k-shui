# Publish one k-shui release: PyPI wheel, npm launcher, multi-arch image, Helm chart.
#
# Three ways in, all of which end up publishing the exact same commit:
#   1. `workflow_call` — release-please calls this after it merges a release PR
#      and creates the tag (see release-please.yml). This is the normal path.
#   2. `push` of a `v*` tag — a hand-cut tag, e.g. the very first release or a
#      backport from a maintenance branch.
#   3. `workflow_dispatch` — re-run publishing for a tag that already exists,
#      after fixing a transient registry failure.
#
# The tag is the source of truth for the version, and `resolve` refuses to
# publish unless the committed version declarations already agree with it —
# release-please bumps them in the release PR, so they always should.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.2.0"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.2.0"
        required: true
        type: string
      release-exists:
        description: "The GitHub release already exists (release-please created it); append install notes instead of creating it"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/k-shui
  CHART_NAME: k-shui

jobs:
  resolve:
    name: resolve & verify version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      major_minor: ${{ steps.v.outputs.major_minor }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      npm_tag: ${{ steps.v.outputs.npm_tag }}
    steps:
      - name: Resolve the tag and parse the semantic version
        id: v
        env:
          # `inputs` is empty for tag pushes, where the ref name is the tag.
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RAW_TAG}"
          version="${tag#v}"
          # Semantic Versioning 2.0.0 — https://semver.org
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "${version}" =~ ${semver} ]]; then
            echo "::error::'${tag}' is not a v-prefixed semantic version (expected e.g. v1.4.0 or v1.4.0-rc.1)"
            exit 1
          fi
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          if [[ "${version}" == *-* ]]; then prerelease=true; npm_tag=next; else prerelease=false; npm_tag=latest; fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "major_minor=${major}.${minor}"
            echo "prerelease=${prerelease}"
            echo "npm_tag=${npm_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing ${tag} (version ${version}, prerelease=${prerelease}, npm dist-tag=${npm_tag})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.v.outputs.tag }}

      # A tag that disagrees with the committed version would ship a wheel whose
      # `k-shui version` lies. release-please bumps these in the release PR.
      - name: Every version declaration must match the tag
        run: python3 scripts/check_versions.py --expect "${{ steps.v.outputs.version }}"

  frontend-build:
    name: build frontend static assets
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-assets
          path: backend/k_shui/static/
          retention-days: 1

  pypi:
    name: build & publish PyPI package
    needs: [resolve, frontend-build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/k-shui
    permissions:
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: static-assets
          path: backend/k_shui/static/
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: uv build
        working-directory: backend
        run: uv build
      # The SPA is what makes the wheel useful; a missing/empty static/ dir would
      # otherwise publish a headless package that only serves the JSON API.
      - name: Assert the wheel ships the built SPA
        working-directory: backend
        run: |
          set -euo pipefail
          whl=$(ls dist/*.whl)
          echo "inspecting ${whl}"
          unzip -l "${whl}" | grep -q 'k_shui/static/index.html'
          assets=$(unzip -l "${whl}" | grep -c 'k_shui/static/assets/')
          echo "static assets in wheel: ${assets}"
          test "${assets}" -gt 0
      - name: Assert the wheel is versioned like the tag
        working-directory: backend
        run: |
          set -euo pipefail
          ls dist/k_shui-${{ needs.resolve.outputs.version }}-*.whl
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist/

  npm:
    name: publish npm package
    needs: [resolve]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Assert package.json already matches the tag
        working-directory: packages/npm
        run: |
          set -euo pipefail
          declared=$(node -p "require('./package.json').version")
          test "${declared}" = "${{ needs.resolve.outputs.version }}"
      - name: npm test
        working-directory: packages/npm
        run: npm test
      # Prereleases land under `next` so `npx k-shui` keeps resolving to stable.
      - name: npm publish
        working-directory: packages/npm
        run: npm publish --provenance --access public --tag "${{ needs.resolve.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: build, sign & attest multi-arch image
    needs: [resolve, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing + SBOM attestation
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: static-assets
          path: backend/k_shui/static/

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Explicit `type=raw` tags rather than `type=semver`: when release-please
      # calls this workflow the triggering ref is `main`, not the tag, so the
      # semver pattern would have nothing to parse. A prerelease never moves
      # `latest`.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=${{ needs.resolve.outputs.major_minor }},enable=${{ needs.resolve.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.prerelease == 'false' }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: |
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  helm:
    name: package & push chart (OCI)
    needs: [resolve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: helm lint
        run: helm lint charts/k-shui

      # Chart.yaml is bumped in the release PR (release-please `extra-files`) and
      # verified against the tag in `resolve`, so nothing is rewritten here.
      - name: helm package
        run: helm package charts/k-shui --destination dist/

      - name: Assert the packaged chart carries the release version
        run: test -f "dist/${CHART_NAME}-${{ needs.resolve.outputs.version }}.tgz"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: helm push
        run: helm push dist/${CHART_NAME}-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  github-release:
    name: publish GitHub release notes
    needs: [resolve, pypi, npm, docker, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      # When release-please already published the release, its CHANGELOG-derived
      # body is the good one — append the install matrix rather than replace it.
      - name: Create or annotate the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: k-shui ${{ needs.resolve.outputs.tag }}
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.resolve.outputs.prerelease == 'false' }}
          generate_release_notes: ${{ inputs.release-exists != true }}
          append_body: ${{ inputs.release-exists == true }}
          body: |
            ## Install k-shui ${{ needs.resolve.outputs.version }}

            ```bash
            uvx k-shui@${{ needs.resolve.outputs.version }} serve          # PyPI
            npx k-shui@${{ needs.resolve.outputs.version }}                # npm launcher
            docker pull ${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.version }}
            helm install k-shui oci://ghcr.io/${{ github.repository_owner }}/charts/k-shui \
              --version ${{ needs.resolve.outputs.version }}
            ```

            The image is cosign-signed (keyless) and ships an SPDX SBOM attestation.
