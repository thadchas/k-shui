version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(backend)"
    labels: [dependencies, backend]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(frontend)"
    labels: [dependencies, frontend]

  - package-ecosystem: npm
    directory: /packages/npm
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(npm-package)"
    labels: [dependencies, npm-package]

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels: [dependencies, ci]
