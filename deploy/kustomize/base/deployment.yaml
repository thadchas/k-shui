apiVersion: apps/v1
kind: Deployment
metadata:
  name: k-shui
  labels:
    app.kubernetes.io/name: k-shui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k-shui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k-shui
    spec:
      serviceAccountName: k-shui
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k-shui
          image: ghcr.io/k-shui/k-shui:latest
          imagePullPolicy: IfNotPresent
          args: ["serve", "--host", "0.0.0.0"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: KSHUI_CONFIG
              value: /etc/k-shui/config.yaml
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/k-shui/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: k-shui-config
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
