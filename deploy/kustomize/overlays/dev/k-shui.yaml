# Dev-overlay config: verbose logging, points at the local `kind` lakestream cluster's
# in-cluster service names.
server:
  host: 0.0.0.0
  port: 8090
  basePath: /
auth:
  type: none
database:
  url: sqlite+aiosqlite:////data/k-shui.db
telemetry:
  metrics: true
  logFormat: console
  logLevel: DEBUG
alerts:
  evaluationIntervalSeconds: 15
clusters:
  - id: dev
    name: dev
    bootstrapServers: lakestream-kafka-bootstrap.kafka:9092
    schemaRegistry:
      url: http://apicurio-registry.kafka:8080/apis/ccompat/v7
      type: apicurio
    connect:
      - name: lakestream-connect
        url: http://lakestream-connect-connect-api.kafka:8083
    flink:
      - name: lakestream-session
        url: http://lakestream-session-rest.flink:8081
