apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: k-shui

resources:
  - ../../base
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: prod

configMapGenerator:
  - name: k-shui-config
    behavior: replace
    files:
      - config.yaml=k-shui.yaml

patches:
  - path: deployment-patch.yaml

images:
  - name: ghcr.io/k-shui/k-shui
    newTag: "0.1.0"
