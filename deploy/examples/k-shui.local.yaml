# k-shui config for the local `lakestream` kind cluster (Strimzi Kafka 4.3, Connect, Apicurio,
# Flink 1.20, Prometheus, Marquez). Run: uvx k-shui serve --config deploy/examples/k-shui.local.yaml
server:
  port: 8090
auth:
  type: none
clusters:
  - id: lakestream
    name: lakestream (kind)
    bootstrapServers: localhost:9094
    schemaRegistry:
      url: http://localhost:8084/apis/ccompat/v7
      type: apicurio
    connect:
      - name: lakestream-connect
        url: http://localhost:8083
    flink:
      - name: lakestream-session
        url: http://localhost:8081
    prometheus:
      url: http://localhost:9090
    lineage:
      type: marquez
      url: http://localhost:3001/api/v1
