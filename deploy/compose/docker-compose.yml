# k-shui standalone demo stack.
#
#   docker compose -f deploy/compose/docker-compose.yml up            # kafka + k-shui only
#   docker compose -f deploy/compose/docker-compose.yml --profile full up   # + connect, schema
#                                                                              registry, flink,
#                                                                              prometheus, lineage
#   docker compose -f deploy/compose/docker-compose.yml --profile lineage up kafka k-shui marquez marquez-db
#
# Run from the repo root so the k-shui build context resolves correctly:
#   docker compose -f deploy/compose/docker-compose.yml up --build

name: k-shui

networks:
  k-shui:
    name: k-shui

volumes:
  kafka-data:
  marquez-db-data:

services:
  # ---------------------------------------------------------------------
  # Core: single-node KRaft Kafka broker+controller. Always started.
  # ---------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    container_name: k-shui-kafka
    networks: [k-shui]
    ports:
      - "29092:29092" # host access, e.g. from k-shui.local.yaml (bootstrapServers: localhost:29092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Core: k-shui itself, built from the repo Dockerfile. Always started.
  # ---------------------------------------------------------------------
  k-shui:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: k-shui
    networks: [k-shui]
    ports:
      - "8090:8090"
    environment:
      KSHUI_CONFIG: /etc/k-shui/config.yaml
    volumes:
      - ./k-shui.yaml:/etc/k-shui/config.yaml:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # `full` profile: Kafka Connect (distributed, single worker) bundled with
  # the Confluent datagen connector so the demo has traffic without needing
  # any license key.
  # ---------------------------------------------------------------------
  connect:
    image: cnfldemos/cp-server-connect-datagen:0.6.4-7.6.0
    hostname: connect
    container_name: k-shui-connect
    profiles: ["full"]
    networks: [k-shui]
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: k-shui-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_LOG4J_ROOT_LOGLEVEL: INFO
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # `full` profile: Apicurio Registry (in-memory), Confluent-compatible API
  # exposed at /apis/ccompat/v7 — matches deploy/examples/k-shui.local.yaml.
  # ---------------------------------------------------------------------
  apicurio-registry:
    image: apicurio/apicurio-registry:3.0.6
    container_name: k-shui-apicurio-registry
    profiles: ["full"]
    networks: [k-shui]
    ports:
      - "8084:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # Apicurio Registry 3.x dropped the 2.x "mem" storage variant (it fails with
      # "No Registry storage variant defined for value mem"); kafkasql keeps the demo
      # dependency-free by reusing the compose broker as the storage log.
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:9092
      APICURIO_REST_DELETION_ARTIFACT_ENABLED: "true"
      APICURIO_REST_DELETION_ARTIFACT-VERSION_ENABLED: "true"
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # `full` profile: single Flink session cluster (jobmanager + 1 taskmanager)
  # with the Prometheus reporter enabled so k-shui can chart JVM/job metrics.
  # ---------------------------------------------------------------------
  flink-jobmanager:
    image: flink:1.20-scala_2.12-java17
    container_name: k-shui-flink-jobmanager
    profiles: ["full"]
    networks: [k-shui]
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    restart: unless-stopped

  flink-taskmanager:
    image: flink:1.20-scala_2.12-java17
    container_name: k-shui-flink-taskmanager
    profiles: ["full"]
    networks: [k-shui]
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # `full` profile: kafka_exporter (broker/topic/consumer-group metrics) +
  # Prometheus scraping it and k-shui's own /metrics.
  # ---------------------------------------------------------------------
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: k-shui-kafka-exporter
    profiles: ["full"]
    networks: [k-shui]
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: k-shui-prometheus
    profiles: ["full"]
    networks: [k-shui]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # `lineage` profile (also included in `full`): Marquez as the OpenLineage
  # backend behind /clusters/{c}/lineage/*.
  # ---------------------------------------------------------------------
  marquez-db:
    image: postgres:14-alpine
    container_name: k-shui-marquez-db
    profiles: ["full", "lineage"]
    networks: [k-shui]
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  marquez:
    image: marquezproject/marquez:0.50.0
    container_name: k-shui-marquez
    profiles: ["full", "lineage"]
    networks: [k-shui]
    ports:
      - "5000:5000" # HTTP API — matches lineage.url http://marquez:5000/api/v1 inside compose
      - "5001:5001" # admin
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    depends_on:
      marquez-db:
        condition: service_healthy
    restart: unless-stopped
