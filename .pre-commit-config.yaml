repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (backend)
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        name: ruff format (backend)
        files: ^backend/

  - repo: local
    hooks:
      # Uses the frontend's own prettier (frontend/package-lock.json) so this hook and the
      # CI `npm run format:check` gate can never disagree on formatting. Run `npm ci` in
      # frontend/ once before committing.
      - id: prettier
        name: prettier (frontend + deploy YAML/JSON/MD)
        entry: frontend/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^(frontend/src|packages/npm|deploy|charts|docs)/.*\.(ts|tsx|css|json|ya?ml|md)$
        exclude: ^charts/.*/templates/ # Helm templates aren't valid YAML/Go-template mix for prettier

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^charts/.*/templates/ # Helm templates aren't plain YAML
      - id: check-json
        exclude: ^packages/npm/package-lock\.json$

  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint charts/k-shui
        entry: charts/k-shui/ci/helm-lint.sh
        language: script
        files: ^charts/k-shui/
        pass_filenames: false
