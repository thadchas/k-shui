repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (backend)
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        name: ruff format (backend)
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier (frontend + deploy YAML/JSON/MD)
        files: ^(frontend/src|packages/npm|deploy|charts|docs)/.*\.(ts|tsx|css|json|ya?ml|md)$
        exclude: ^charts/.*/templates/ # Helm templates aren't valid YAML/Go-template mix for prettier
        additional_dependencies:
          - prettier@3.5.0

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^charts/.*/templates/ # Helm templates aren't plain YAML
      - id: check-json
        exclude: ^packages/npm/package-lock\.json$

  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint charts/k-shui
        entry: charts/k-shui/ci/helm-lint.sh
        language: script
        files: ^charts/k-shui/
        pass_filenames: false
